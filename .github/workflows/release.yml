name: Android Release & Deploy

on:
  push:
    tags:
      - 'v*' # Запускается при создании тега, например v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. Проверки
      - name: Run Lint & Tests
        run: ./gradlew lint test

      # 2. Сборка Release Bundle (AAB)
      - name: Build Release Bundle
        run: ./gradlew bundleRelease

      # 3. Подпись AAB (используем секреты GitHub)
      - name: Sign AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # 4. Сохранение подписанного файла в артефакты GitHub (на всякий случай)
      - name: Upload Signed AAB to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-aab
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      # 5. Публикация в Google Play (Internal track)
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonRaw: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.rukinpavel.wordlyapp
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          track: alpha # Можно изменить на 'alpha', 'beta' или 'production internal'
          status: completed
